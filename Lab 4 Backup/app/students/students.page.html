<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>students</ion-title>
  </ion-toolbar>
</ion-header>


  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Students</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content class = "ion-padding">
    <ion-list>
      @for (s of students; track s.sid) {
        <ion-item [routerLink] = "['/student-details']" [state]= "{selectedStudent: s}">{{s.name}}</ion-item>
      }
    </ion-list>

    <ion-button (click)="close()">Back</ion-button>

</ion-content>
